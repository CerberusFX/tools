<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="58" font-weight="bold" fill="#F5F2FC">BULL &amp; BEAR FLAG</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">CHEAT SHEET</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">Continuation patterns after a sharp move</text>

  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Bull Flag -->
  <rect x="55" y="250" width="470" height="330" rx="18" fill="#25213A"/>
  <text x="80" y="288" font-size="22" font-weight="bold" fill="#F5F2FC">Bull Flag</text>
  <path d="M 90 520 L 220 320" fill="none" stroke="#2E9E6B" stroke-width="7" stroke-linecap="round"/>
  <text x="90" y="310" font-size="15" fill="#2E9E6B">Flagpole</text>
  <path d="M 220 320 L 280 360 L 340 340 L 400 380 L 460 360"
        fill="none" stroke="#C9C2E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="290" y="415" font-size="15" fill="#C9C2E8">Flag (drift down/sideways)</text>
  <path d="M 460 360 L 500 240" fill="none" stroke="#2E9E6B" stroke-width="7" stroke-linecap="round" stroke-dasharray="2,10"/>
  <text x="440" y="230" font-size="15" fill="#2E9E6B">Breakout continues up</text>

  <!-- Bear Flag -->
  <rect x="555" y="250" width="470" height="330" rx="18" fill="#25213A"/>
  <text x="580" y="288" font-size="22" font-weight="bold" fill="#F5F2FC">Bear Flag</text>
  <path d="M 590 320 L 720 520" fill="none" stroke="#E05B5B" stroke-width="7" stroke-linecap="round"/>
  <text x="590" y="310" font-size="15" fill="#E05B5B">Flagpole</text>
  <path d="M 720 520 L 780 480 L 840 500 L 900 460 L 960 480"
        fill="none" stroke="#C9C2E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="770" y="440" font-size="15" fill="#C9C2E8">Flag (drift up/sideways)</text>
  <path d="M 960 480 L 990 580" fill="none" stroke="#E05B5B" stroke-width="7" stroke-linecap="round" stroke-dasharray="2,10"/>
  <text x="920" y="600" font-size="15" fill="#E05B5B">Breakout continues down</text>

  <!-- Info cards -->
  <g>
    <rect x="55" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="80" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">Structure</text>
    <text x="80" y="692" font-size="16" fill="#C9C2E8">A sharp move (the pole)</text>
    <text x="80" y="718" font-size="16" fill="#C9C2E8">followed by a tight,</text>
    <text x="80" y="744" font-size="16" fill="#C9C2E8">brief pullback that</text>
    <text x="80" y="770" font-size="16" fill="#C9C2E8">slopes against the</text>
    <text x="80" y="796" font-size="16" fill="#C9C2E8">original move.</text>
  </g>
  <g>
    <rect x="386" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="411" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">Entry</text>
    <text x="411" y="692" font-size="16" fill="#C9C2E8">On a confirmed break</text>
    <text x="411" y="718" font-size="16" fill="#C9C2E8">of the flag's trendline,</text>
    <text x="411" y="744" font-size="16" fill="#C9C2E8">in the direction of</text>
    <text x="411" y="770" font-size="16" fill="#C9C2E8">the original pole.</text>
    <text x="411" y="806" font-size="16" fill="#C9C2E8">Volume often dries up</text>
    <text x="411" y="832" font-size="16" fill="#C9C2E8">inside the flag itself.</text>
  </g>
  <g>
    <rect x="717" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="742" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">Target</text>
    <text x="742" y="692" font-size="16" fill="#C9C2E8">Measure the length</text>
    <text x="742" y="718" font-size="16" fill="#C9C2E8">of the flagpole and</text>
    <text x="742" y="744" font-size="16" fill="#C9C2E8">project it forward from</text>
    <text x="742" y="770" font-size="16" fill="#C9C2E8">the breakout point —</text>
    <text x="742" y="796" font-size="16" fill="#C9C2E8">the "measured move."</text>
  </g>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
