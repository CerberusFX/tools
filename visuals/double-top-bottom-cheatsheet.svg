<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="58" font-weight="bold" fill="#F5F2FC">DOUBLE TOP</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">&amp; DOUBLE BOTTOM</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">Two peaks, one clear signal</text>

  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Double Top chart -->
  <rect x="55" y="250" width="470" height="330" rx="18" fill="#25213A"/>
  <text x="80" y="288" font-size="22" font-weight="bold" fill="#F5F2FC">Double Top (bearish)</text>
  <line x1="90" y1="500" x2="480" y2="500" stroke="#C9C2E8" stroke-width="3" stroke-dasharray="8,6"/>
  <path d="M 90 460 L 180 340 L 260 440 L 350 340 L 440 520"
        fill="none" stroke="#E05B5B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="180" cy="340" r="7" fill="#F5F2FC"/>
  <circle cx="350" cy="340" r="7" fill="#F5F2FC"/>
  <text x="330" y="480" font-size="15" fill="#C9C2E8">Support</text>

  <!-- Double Bottom chart -->
  <rect x="555" y="250" width="470" height="330" rx="18" fill="#25213A"/>
  <text x="580" y="288" font-size="22" font-weight="bold" fill="#F5F2FC">Double Bottom (bullish)</text>
  <line x1="590" y1="360" x2="980" y2="360" stroke="#C9C2E8" stroke-width="3" stroke-dasharray="8,6"/>
  <path d="M 590 400 L 680 520 L 760 420 L 850 520 L 940 340"
        fill="none" stroke="#2E9E6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="520" r="7" fill="#F5F2FC"/>
  <circle cx="850" cy="520" r="7" fill="#F5F2FC"/>
  <text x="830" y="340" font-size="15" fill="#C9C2E8">Resistance</text>

  <!-- Info cards -->
  <g>
    <rect x="55" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="80" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">What it shows</text>
    <text x="80" y="692" font-size="16" fill="#C9C2E8">Price tests the same</text>
    <text x="80" y="718" font-size="16" fill="#C9C2E8">level twice and fails</text>
    <text x="80" y="744" font-size="16" fill="#C9C2E8">to break through.</text>
    <text x="80" y="780" font-size="16" fill="#C9C2E8">Signals that momentum</text>
    <text x="80" y="806" font-size="16" fill="#C9C2E8">in the prior direction</text>
    <text x="80" y="832" font-size="16" fill="#C9C2E8">is running out.</text>
  </g>
  <g>
    <rect x="386" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="411" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">Entry</text>
    <text x="411" y="692" font-size="16" fill="#C9C2E8">Wait for a confirmed</text>
    <text x="411" y="718" font-size="16" fill="#C9C2E8">close through the</text>
    <text x="411" y="744" font-size="16" fill="#C9C2E8">middle level (the</text>
    <text x="411" y="770" font-size="16" fill="#C9C2E8">valley or peak between</text>
    <text x="411" y="796" font-size="16" fill="#C9C2E8">the two tops/bottoms).</text>
  </g>
  <g>
    <rect x="717" y="610" width="308" height="360" rx="16" fill="#25213A"/>
    <text x="742" y="655" font-size="22" font-weight="bold" fill="#F5F2FC">Target</text>
    <text x="742" y="692" font-size="16" fill="#C9C2E8">Measure the distance</text>
    <text x="742" y="718" font-size="16" fill="#C9C2E8">from the peaks/bottoms</text>
    <text x="742" y="744" font-size="16" fill="#C9C2E8">to the middle level,</text>
    <text x="742" y="770" font-size="16" fill="#C9C2E8">then project that same</text>
    <text x="742" y="796" font-size="16" fill="#C9C2E8">distance past the break.</text>
  </g>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
