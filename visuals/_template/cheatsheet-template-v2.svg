<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500">

  <!-- ============================================================
       CERBERUSFX CHEAT SHEET — LAYOUT TEMPLATE v2
       Based on the "Mastering Price Action" reference format.
       Canvas: 1080x1500 (vertical, social-first).
       Palette (fixed, do not change):
         Background:  #F5F2FC (light card bg used as page bg here)
         Dark navy:   #1E1B2E (headline / footer bg)
         Purple:      #5B3FD6 (accent)
         Purple dark: #3A2599 (accent dark)
         Lavender:    #C9C2E8 (soft accent fills)
         Green:       #2E9E6B (bullish / confirm)
         Red:         #C0392B (bearish / warning, new)
       Font: DejaVu Sans Bold for all headline/label text.
       Every text block below is a PLACEHOLDER — replace per sheet topic.
       Sections marked REQUIRED must appear on every sheet for brand consistency.
     ============================================================ -->

  <defs>
    <style>
      .headline   { font-family: 'DejaVu Sans', sans-serif; font-weight: bold; }
      .body       { font-family: 'DejaVu Sans', sans-serif; }
    </style>
  </defs>

  <!-- PAGE BACKGROUND -->
  <rect x="0" y="0" width="1080" height="1500" fill="#FFFFFF"/>

  <!-- ============================================================
       1. HEADER BLOCK (REQUIRED)
       - Two-line title: neutral line (navy) + colored payoff line (green/red split like ref)
       - Subtitle bar: dark navy pill with white text (the "rule" tagline)
     ============================================================ -->
  <text x="40" y="70" class="headline" font-size="46" fill="#1E1B2E">TITLE LINE ONE: TOPIC</text>
  <text x="40" y="128" class="headline" font-size="52">
    <tspan fill="#2E9E6B">KEY TERM A</tspan>
    <tspan fill="#1E1B2E"> &amp; </tspan>
    <tspan fill="#C0392B">KEY TERM B</tspan>
  </text>
  <rect x="40" y="150" width="640" height="42" rx="4" fill="#1E1B2E"/>
  <text x="60" y="178" class="headline" font-size="20" fill="#FFFFFF">ONE-LINE TAGLINE / RULE OF THE SETUP</text>

  <!-- ============================================================
       2. MAIN VISUAL AREA (REQUIRED)
       - Left/center: annotated chart or diagram illustrating the pattern
       - Right: "KEY RULES" numbered sidebar (dark navy card, green number chips)
       - Replace the placeholder chart with real pattern-specific SVG paths
     ============================================================ -->
  <rect x="40" y="210" width="1000" height="620" fill="#FDFDFD" stroke="#E5E0F0" stroke-width="2"/>
  <text x="60" y="250" class="body" font-size="22" fill="#999" font-style="italic">[ annotated chart / pattern diagram goes here ]</text>

  <!-- Key Rules sidebar -->
  <rect x="770" y="230" width="250" height="380" fill="#1E1B2E" rx="6"/>
  <text x="800" y="266" class="headline" font-size="22" fill="#FFFFFF">KEY RULES</text>
  <!-- Repeat this group per rule (7 max recommended) -->
  <circle cx="800" cy="300" r="12" fill="#2E9E6B"/>
  <text x="800" y="305" class="headline" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="822" y="305" class="body" font-size="15" fill="#F5F2FC">Rule text line one.</text>

  <!-- ============================================================
       3. FIVE-STEP MINI PANEL ROW (REQUIRED)
       - Exactly 5 equal panels, thin border, small illustrative icon/sketch
       - Numbered + colored step title, 2-3 line description
     ============================================================ -->
  <!-- Panel template (repeat x5, width ~204px each with 8px gaps across 1000px) -->
  <rect x="40" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="56" y="884" class="headline" font-size="18" fill="#5B3FD6">1. STEP NAME</text>
  <text x="56" y="1040" class="body" font-size="14" fill="#333">Short description of what</text>
  <text x="56" y="1060" class="body" font-size="14" fill="#333">this step means, 2-3 lines.</text>

  <!-- ============================================================
       4. THREE-BOX INFO ROW (REQUIRED)
       - Confirmation Factors (green checks) | Best Timeframes (clock icon) | Pro Tips (orange checks + icon)
     ============================================================ -->
  <rect x="40" y="1090" width="330" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="60" y="1124" class="headline" font-size="20" fill="#2E9E6B">CONFIRMATION FACTORS</text>

  <rect x="385" y="1090" width="300" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="405" y="1124" class="headline" font-size="20" fill="#5B3FD6">BEST TIMEFRAMES</text>

  <rect x="700" y="1090" width="340" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="720" y="1124" class="headline" font-size="20" fill="#E67E22">PRO TIPS</text>

  <!-- ============================================================
       5. FOOTER BANNER (REQUIRED — brand-fixed, do not change wording style)
       - Dark navy full-width bar, short imperative tagline, channel handle centered below
     ============================================================ -->
  <rect x="0" y="1340" width="1080" height="80" fill="#1E1B2E"/>
  <text x="540" y="1382" class="headline" font-size="24" fill="#FFFFFF" text-anchor="middle">
    <tspan fill="#2E9E6B">PLAN</tspan> YOUR TRADE. <tspan fill="#5B3FD6">EXECUTE</tspan> WITH DISCIPLINE.
  </text>
  <text x="540" y="1445" class="body" font-size="20" fill="#1E1B2E" text-anchor="middle">Telegram Channel: t.me/CerberusFXTrading</text>

</svg>
