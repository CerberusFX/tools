<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="58" font-weight="bold" fill="#F5F2FC">ORDER TYPES</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">CHEAT SHEET</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">Market, Limit, Stop, Stop-Limit explained</text>

  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <g>
    <rect x="55" y="260" width="478" height="330" rx="18" fill="#25213A"/>
    <text x="80" y="305" font-size="26" font-weight="bold" fill="#F5F2FC">Market Order</text>
    <text x="80" y="345" font-size="17" fill="#C9C2E8">Executes immediately at</text>
    <text x="80" y="371" font-size="17" fill="#C9C2E8">the current best price.</text>
    <text x="80" y="410" font-size="17" fill="#2E9E6B">+ Guaranteed fill</text>
    <text x="80" y="436" font-size="17" fill="#E05B5B">− No price control (slippage)</text>
    <text x="80" y="480" font-size="16" fill="#C9C2E8">Use when speed matters</text>
    <text x="80" y="506" font-size="16" fill="#C9C2E8">more than exact price.</text>
  </g>
  <g>
    <rect x="547" y="260" width="478" height="330" rx="18" fill="#25213A"/>
    <text x="572" y="305" font-size="26" font-weight="bold" fill="#F5F2FC">Limit Order</text>
    <text x="572" y="345" font-size="17" fill="#C9C2E8">Executes only at your</text>
    <text x="572" y="371" font-size="17" fill="#C9C2E8">chosen price or better.</text>
    <text x="572" y="410" font-size="17" fill="#2E9E6B">+ Full price control</text>
    <text x="572" y="436" font-size="17" fill="#E05B5B">− May never fill</text>
    <text x="572" y="480" font-size="16" fill="#C9C2E8">Use to buy dips or sell</text>
    <text x="572" y="506" font-size="16" fill="#C9C2E8">rallies at a specific level.</text>
  </g>
  <g>
    <rect x="55" y="610" width="478" height="330" rx="18" fill="#25213A"/>
    <text x="80" y="655" font-size="26" font-weight="bold" fill="#F5F2FC">Stop Order</text>
    <text x="80" y="695" font-size="17" fill="#C9C2E8">Becomes a market order</text>
    <text x="80" y="721" font-size="17" fill="#C9C2E8">once price hits your</text>
    <text x="80" y="747" font-size="17" fill="#C9C2E8">trigger level.</text>
    <text x="80" y="786" font-size="17" fill="#2E9E6B">+ Great for stop-losses</text>
    <text x="80" y="812" font-size="17" fill="#E05B5B">− Slippage still possible</text>
    <text x="80" y="856" font-size="16" fill="#C9C2E8">Use to limit losses or</text>
    <text x="80" y="882" font-size="16" fill="#C9C2E8">enter on a breakout.</text>
  </g>
  <g>
    <rect x="547" y="610" width="478" height="330" rx="18" fill="#25213A"/>
    <text x="572" y="655" font-size="26" font-weight="bold" fill="#F5F2FC">Stop-Limit Order</text>
    <text x="572" y="695" font-size="17" fill="#C9C2E8">Trigger converts it into</text>
    <text x="572" y="721" font-size="17" fill="#C9C2E8">a limit order, not a</text>
    <text x="572" y="747" font-size="17" fill="#C9C2E8">market order.</text>
    <text x="572" y="786" font-size="17" fill="#2E9E6B">+ Price control after trigger</text>
    <text x="572" y="812" font-size="17" fill="#E05B5B">− Can miss fast markets</text>
    <text x="572" y="856" font-size="16" fill="#C9C2E8">Use when you want a stop</text>
    <text x="572" y="882" font-size="16" fill="#C9C2E8">but need a price floor/cap.</text>
  </g>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
