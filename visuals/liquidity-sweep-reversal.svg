<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500">
  <defs>
    <style>
      .headline { font-family: 'DejaVu Sans', sans-serif; font-weight: bold; }
      .body { font-family: 'DejaVu Sans', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1500" fill="#FFFFFF"/>

  <!-- HEADER -->
  <text x="40" y="70" class="headline" font-size="42" fill="#1E1B2E">SMART MONEY CONCEPTS:</text>
  <text x="40" y="126" class="headline" font-size="50">
    <tspan fill="#C0392B">LIQUIDITY SWEEP</tspan>
    <tspan fill="#1E1B2E"> &amp; </tspan>
    <tspan fill="#2E9E6B">REVERSAL</tspan>
  </text>
  <rect x="40" y="150" width="660" height="42" rx="4" fill="#1E1B2E"/>
  <text x="60" y="178" class="headline" font-size="19" fill="#FFFFFF">DON'T CHASE STOP HUNTS. TRADE THE REVERSAL.</text>

  <!-- MAIN VISUAL AREA -->
  <rect x="40" y="210" width="1000" height="620" fill="#FDFDFD" stroke="#E5E0F0" stroke-width="2"/>

  <!-- range with equal lows (liquidity pool) -->
  <path d="M 70 400 L 110 460 L 150 500 L 190 470 L 230 500 L 270 460 L 310 500"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>
  <line x1="140" y1="500" x2="320" y2="500" stroke="#3A2599" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="140" y="520" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">EQUAL LOWS (Liquidity Pool)</text>

  <!-- sweep below the low -->
  <path d="M 310 500 L 350 545" fill="none" stroke="#C0392B" stroke-width="4"/>
  <rect x="330" y="500" width="60" height="55" fill="#F2C6C1" opacity="0.7"/>
  <text x="395" y="530" class="body" font-size="14" fill="#C0392B" font-weight="bold">LIQUIDITY SWEEP</text>
  <text x="395" y="548" class="body" font-size="12" fill="#333">Stop hunt below the lows</text>

  <!-- sharp reversal back up -->
  <path d="M 350 545 L 380 500 L 410 440 L 440 390 L 470 350 L 500 320"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>
  <text x="410" y="410" class="body" font-size="14" fill="#2E9E6B" font-weight="bold">SHARP REVERSAL</text>

  <!-- CHoCH marker -->
  <line x1="270" y1="460" x2="500" y2="460" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="520" y="465" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">CHoCH (Change of Character)</text>

  <!-- pullback to sweep candle / entry zone -->
  <path d="M 500 320 L 520 355 L 540 385 L 560 400"
        fill="none" stroke="#C0392B" stroke-width="4"/>
  <rect x="520" y="380" width="90" height="45" fill="#DDD" opacity="0.6" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="530" y="475" class="body" font-size="13" fill="#1E1B2E" font-weight="bold">SWEEP CANDLE</text>
  <text x="530" y="490" class="body" font-size="12" fill="#333">(entry zone on retest)</text>

  <!-- buy entry -->
  <circle cx="560" cy="400" r="18" fill="none" stroke="#1E1B2E" stroke-width="2"/>
  <path d="M 560 400 L 590 360 L 620 330 L 650 300"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>
  <text x="600" y="355" class="body" font-size="14" fill="#2E9E6B" font-weight="bold">BUY ENTRY</text>
  <text x="600" y="372" class="body" font-size="12" fill="#333">After bullish confirmation</text>

  <!-- stop loss below sweep -->
  <rect x="330" y="555" width="180" height="45" fill="#F2C6C1" opacity="0.7"/>
  <text x="345" y="578" class="body" font-size="14" fill="#C0392B" font-weight="bold">STOP LOSS</text>
  <text x="345" y="595" class="body" font-size="12" fill="#333">Below the sweep low</text>

  <!-- take profit -->
  <line x1="650" y1="300" x2="650" y2="750" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="660" y="740" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">TAKE PROFIT</text>
  <text x="660" y="758" class="body" font-size="12" fill="#333">Prior high or opposing liquidity</text>

  <!-- Key Rules sidebar -->
  <rect x="770" y="230" width="250" height="530" fill="#1E1B2E" rx="6"/>
  <text x="800" y="266" class="headline" font-size="22" fill="#FFFFFF">KEY RULES</text>

  <circle cx="800" cy="298" r="12" fill="#2E9E6B"/>
  <text x="800" y="303" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="822" y="292" class="body" font-size="14" fill="#F5F2FC">Mark equal highs/lows</text>
  <text x="822" y="308" class="body" font-size="14" fill="#F5F2FC">as liquidity pools.</text>

  <circle cx="800" cy="336" r="12" fill="#2E9E6B"/>
  <text x="800" y="341" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="822" y="330" class="body" font-size="14" fill="#F5F2FC">Wait for price to sweep</text>
  <text x="822" y="346" class="body" font-size="14" fill="#F5F2FC">through the level.</text>

  <circle cx="800" cy="374" r="12" fill="#2E9E6B"/>
  <text x="800" y="379" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="822" y="368" class="body" font-size="14" fill="#F5F2FC">Confirm a sharp rejection</text>
  <text x="822" y="384" class="body" font-size="14" fill="#F5F2FC">back into the range.</text>

  <circle cx="800" cy="412" r="12" fill="#2E9E6B"/>
  <text x="800" y="417" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="822" y="406" class="body" font-size="14" fill="#F5F2FC">Look for a CHoCH on a</text>
  <text x="822" y="422" class="body" font-size="14" fill="#F5F2FC">lower timeframe.</text>

  <circle cx="800" cy="450" r="12" fill="#2E9E6B"/>
  <text x="800" y="455" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="822" y="444" class="body" font-size="14" fill="#F5F2FC">Enter on retest of the</text>
  <text x="822" y="460" class="body" font-size="14" fill="#F5F2FC">sweep candle.</text>

  <circle cx="800" cy="488" r="12" fill="#2E9E6B"/>
  <text x="800" y="493" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="822" y="482" class="body" font-size="14" fill="#F5F2FC">Place Stop Loss beyond</text>
  <text x="822" y="498" class="body" font-size="14" fill="#F5F2FC">the sweep wick.</text>

  <circle cx="800" cy="526" r="12" fill="#2E9E6B"/>
  <text x="800" y="531" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="822" y="520" class="body" font-size="14" fill="#F5F2FC">Target opposing</text>
  <text x="822" y="536" class="body" font-size="14" fill="#F5F2FC">liquidity or prior high.</text>

  <!-- FIVE-STEP PANEL ROW -->
  <rect x="40" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="56" y="882" class="headline" font-size="16" fill="#5B3FD6">1. LIQUIDITY POOL</text>
  <path d="M 60 920 L 90 950 L 120 920 L 150 950 L 180 920" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <line x1="60" y1="950" x2="180" y2="950" stroke="#C9C2E8" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="56" y="1000" class="body" font-size="13" fill="#333">Equal highs or lows attract</text>
  <text x="56" y="1018" class="body" font-size="13" fill="#333">resting stop orders — a</text>
  <text x="56" y="1036" class="body" font-size="13" fill="#333">liquidity pool.</text>

  <rect x="252" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="268" y="882" class="headline" font-size="16" fill="#5B3FD6">2. THE SWEEP</text>
  <path d="M 272 920 L 300 940 L 328 970 L 356 935" fill="none" stroke="#C0392B" stroke-width="3"/>
  <text x="268" y="1000" class="body" font-size="13" fill="#333">Price briefly pierces the</text>
  <text x="268" y="1018" class="body" font-size="13" fill="#333">level, triggers stops, then</text>
  <text x="268" y="1036" class="body" font-size="13" fill="#333">snaps back.</text>

  <rect x="464" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="480" y="882" class="headline" font-size="16" fill="#5B3FD6">3. CHoCH</text>
  <path d="M 484 960 L 512 940 L 540 950 L 568 900 L 596 870" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <text x="480" y="1000" class="body" font-size="13" fill="#333">Change of Character signals</text>
  <text x="480" y="1018" class="body" font-size="13" fill="#333">momentum has flipped in</text>
  <text x="480" y="1036" class="body" font-size="13" fill="#333">favor of a reversal.</text>

  <rect x="676" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="692" y="882" class="headline" font-size="16" fill="#5B3FD6">4. SWEEP CANDLE</text>
  <rect x="696" y="905" width="164" height="45" fill="#DDD" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="692" y="1000" class="body" font-size="13" fill="#333">The candle that made the</text>
  <text x="692" y="1018" class="body" font-size="13" fill="#333">sweep becomes the key</text>
  <text x="692" y="1036" class="body" font-size="13" fill="#333">zone to watch for entry.</text>

  <rect x="888" y="850" width="152" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="900" y="882" class="headline" font-size="15" fill="#2E9E6B">5. ENTRY SETUP</text>
  <path d="M 900 950 L 920 930 L 940 940 L 960 900" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <circle cx="940" cy="940" r="8" fill="none" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="900" y="1000" class="body" font-size="12" fill="#333">Price retests the sweep</text>
  <text x="900" y="1016" class="body" font-size="12" fill="#333">candle zone. Enter on</text>
  <text x="900" y="1032" class="body" font-size="12" fill="#333">bullish confirmation.</text>

  <!-- THREE-BOX INFO ROW -->
  <rect x="40" y="1090" width="330" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="60" y="1124" class="headline" font-size="19" fill="#2E9E6B">CONFIRMATION FACTORS</text>
  <text x="60" y="1156" class="body" font-size="14" fill="#333">✓ Sharp rejection wick on sweep</text>
  <text x="60" y="1180" class="body" font-size="14" fill="#333">✓ CHoCH on lower timeframe</text>
  <text x="60" y="1204" class="body" font-size="14" fill="#333">✓ Volume spike into the sweep</text>
  <text x="60" y="1228" class="body" font-size="14" fill="#333">✓ Confluence with HTF level</text>
  <text x="60" y="1252" class="body" font-size="14" fill="#333">✓ Clean, fresh liquidity pool</text>

  <rect x="385" y="1090" width="300" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="405" y="1124" class="headline" font-size="19" fill="#5B3FD6">BEST TIMEFRAMES</text>
  <text x="405" y="1160" class="body" font-size="14" fill="#333">This setup works best on:</text>
  <text x="415" y="1186" class="body" font-size="14" fill="#333">•  5m – 15m</text>
  <text x="415" y="1210" class="body" font-size="14" fill="#333">•  1H</text>
  <text x="415" y="1234" class="body" font-size="14" fill="#333">•  4H</text>
  <text x="415" y="1258" class="body" font-size="14" fill="#333">•  Around session opens</text>

  <rect x="700" y="1090" width="340" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="720" y="1124" class="headline" font-size="19" fill="#E67E22">PRO TIPS</text>
  <text x="720" y="1156" class="body" font-size="14" fill="#333">✓ Sweeps often happen around</text>
  <text x="732" y="1174" class="body" font-size="14" fill="#333">news or session opens.</text>
  <text x="720" y="1200" class="body" font-size="14" fill="#333">✓ Don't enter on the sweep itself</text>
  <text x="732" y="1218" class="body" font-size="14" fill="#333">— wait for confirmation.</text>
  <text x="720" y="1244" class="body" font-size="14" fill="#333">✓ Tight stops beyond the wick</text>
  <text x="732" y="1262" class="body" font-size="14" fill="#333">keep risk defined.</text>

  <!-- FOOTER -->
  <rect x="0" y="1340" width="1080" height="80" fill="#1E1B2E"/>
  <text x="540" y="1382" class="headline" font-size="23" fill="#FFFFFF" text-anchor="middle">
    <tspan fill="#2E9E6B">PLAN</tspan> YOUR TRADE. <tspan fill="#5B3FD6">EXECUTE</tspan> WITH DISCIPLINE.
  </text>
  <text x="540" y="1445" class="body" font-size="20" fill="#1E1B2E" text-anchor="middle">Telegram Channel: t.me/CerberusFXTrading</text>

</svg>
