<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500">
  <defs>
    <style>
      .headline { font-family: 'DejaVu Sans', sans-serif; font-weight: bold; }
      .body { font-family: 'DejaVu Sans', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1500" fill="#FFFFFF"/>

  <!-- HEADER -->
  <text x="40" y="70" class="headline" font-size="42" fill="#1E1B2E">SMART MONEY CONCEPTS:</text>
  <text x="40" y="126" class="headline" font-size="50">
    <tspan fill="#2E9E6B">DOUBLE BOTTOM</tspan>
    <tspan fill="#1E1B2E"> &amp; </tspan>
    <tspan fill="#5B3FD6">ORDER BLOCK</tspan>
  </text>
  <rect x="40" y="150" width="660" height="42" rx="4" fill="#1E1B2E"/>
  <text x="60" y="178" class="headline" font-size="19" fill="#FFFFFF">FOLLOW MARKET STRUCTURE. TRADE WITH CONFIDENCE.</text>

  <!-- MAIN VISUAL AREA -->
  <rect x="40" y="210" width="1000" height="620" fill="#FDFDFD" stroke="#E5E0F0" stroke-width="2"/>

  <!-- simplified annotated chart: double bottom -> MSS -> BOS -> pullback into order block -> sell entry -->
  <path d="M 70 380 L 100 420 L 130 460 L 160 500 L 190 470 L 220 500 L 250 460 L 280 420 L 310 460 L 340 500"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>
  <!-- double bottom marker -->
  <rect x="150" y="440" width="150" height="90" fill="#C9C2E8" opacity="0.35"/>
  <text x="155" y="435" class="body" font-size="15" fill="#5B3FD6" font-weight="bold">DOUBLE BOTTOM</text>
  <line x1="160" y1="500" x2="300" y2="500" stroke="#3A2599" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- MSS label -->
  <text x="70" y="560" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">MSS (Market Structure Shift)</text>
  <line x1="70" y1="545" x2="340" y2="545" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- rally into order block -->
  <path d="M 340 500 L 370 440 L 400 400 L 430 360 L 460 340 L 490 360 L 520 380"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>

  <!-- order block box -->
  <rect x="420" y="330" width="180" height="60" fill="#DDD" opacity="0.6" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="440" y="365" class="headline" font-size="16" fill="#1E1B2E">ORDER BLOCK</text>

  <!-- BOS label under retrace -->
  <path d="M 520 380 L 550 420 L 580 460 L 610 500 L 640 520 L 670 500 L 700 460"
        fill="none" stroke="#C0392B" stroke-width="4"/>
  <text x="530" y="545" class="body" font-size="14" fill="#C0392B" font-weight="bold">BOS (Break of Structure)</text>
  <line x1="520" y1="530" x2="700" y2="530" stroke="#C0392B" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- pullback into OB level and rejection -->
  <path d="M 700 460 L 720 420 L 740 390 L 760 370 L 780 385 L 800 400"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>
  <circle cx="780" cy="385" r="18" fill="none" stroke="#1E1B2E" stroke-width="2"/>

  <!-- stop loss zone -->
  <rect x="700" y="330" width="120" height="45" fill="#F2C6C1" opacity="0.7"/>
  <text x="830" y="345" class="body" font-size="14" fill="#C0392B" font-weight="bold">STOP LOSS</text>
  <text x="830" y="363" class="body" font-size="12" fill="#333">Above Order Block</text>
  <text x="830" y="378" class="body" font-size="12" fill="#333">or recent high</text>

  <!-- sell entry -->
  <path d="M 800 400 L 820 440 L 840 480"
        fill="none" stroke="#C0392B" stroke-width="4"/>
  <text x="830" y="470" class="body" font-size="14" fill="#C0392B" font-weight="bold">SELL ENTRY</text>
  <text x="830" y="488" class="body" font-size="12" fill="#333">After bearish confirmation</text>

  <!-- take profit -->
  <line x1="840" y1="480" x2="840" y2="780" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="640" y="770" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">TAKE PROFIT</text>
  <text x="640" y="788" class="body" font-size="12" fill="#333">Next support or liquidity level</text>

  <!-- Key Rules sidebar -->
  <rect x="770" y="230" width="250" height="530" fill="#1E1B2E" rx="6"/>
  <text x="800" y="266" class="headline" font-size="22" fill="#FFFFFF">KEY RULES</text>

  <circle cx="800" cy="298" r="12" fill="#2E9E6B"/>
  <text x="800" y="303" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="822" y="292" class="body" font-size="14" fill="#F5F2FC">Identify Double Bottom</text>
  <text x="822" y="308" class="body" font-size="14" fill="#F5F2FC">formation.</text>

  <circle cx="800" cy="336" r="12" fill="#2E9E6B"/>
  <text x="800" y="341" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="822" y="330" class="body" font-size="14" fill="#F5F2FC">Wait for MSS (Market</text>
  <text x="822" y="346" class="body" font-size="14" fill="#F5F2FC">Structure Shift).</text>

  <circle cx="800" cy="374" r="12" fill="#2E9E6B"/>
  <text x="800" y="379" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="822" y="368" class="body" font-size="14" fill="#F5F2FC">Confirm BOS (Break</text>
  <text x="822" y="384" class="body" font-size="14" fill="#F5F2FC">of Structure).</text>

  <circle cx="800" cy="412" r="12" fill="#2E9E6B"/>
  <text x="800" y="417" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="822" y="406" class="body" font-size="14" fill="#F5F2FC">Wait for price to return</text>
  <text x="822" y="422" class="body" font-size="14" fill="#F5F2FC">to the Order Block.</text>

  <circle cx="800" cy="450" r="12" fill="#2E9E6B"/>
  <text x="800" y="455" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="822" y="444" class="body" font-size="14" fill="#F5F2FC">Enter on bearish</text>
  <text x="822" y="460" class="body" font-size="14" fill="#F5F2FC">rejection.</text>

  <circle cx="800" cy="488" r="12" fill="#2E9E6B"/>
  <text x="800" y="493" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="822" y="482" class="body" font-size="14" fill="#F5F2FC">Place Stop Loss above</text>
  <text x="822" y="498" class="body" font-size="14" fill="#F5F2FC">the Order Block.</text>

  <circle cx="800" cy="526" r="12" fill="#2E9E6B"/>
  <text x="800" y="531" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="822" y="520" class="body" font-size="14" fill="#F5F2FC">Take Profit at next</text>
  <text x="822" y="536" class="body" font-size="14" fill="#F5F2FC">support or liquidity.</text>

  <!-- FIVE-STEP PANEL ROW -->
  <!-- Panel 1: Double Bottom -->
  <rect x="40" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="56" y="882" class="headline" font-size="16" fill="#5B3FD6">1. DOUBLE BOTTOM</text>
  <path d="M 60 910 L 90 950 L 120 920 L 150 950 L 180 910" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <line x1="60" y1="920" x2="180" y2="920" stroke="#C9C2E8" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="56" y="1000" class="body" font-size="13" fill="#333">Price forms two lows at</text>
  <text x="56" y="1018" class="body" font-size="13" fill="#333">the same level. Signals a</text>
  <text x="56" y="1036" class="body" font-size="13" fill="#333">potential trend reversal.</text>

  <!-- Panel 2: MSS -->
  <rect x="252" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="268" y="882" class="headline" font-size="16" fill="#5B3FD6">2. MSS</text>
  <path d="M 272 950 L 300 930 L 328 940 L 356 900 L 384 870" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <text x="268" y="1000" class="body" font-size="13" fill="#333">Market Structure Shift:</text>
  <text x="268" y="1018" class="body" font-size="13" fill="#333">price breaks the previous</text>
  <text x="268" y="1036" class="body" font-size="13" fill="#333">swing high.</text>

  <!-- Panel 3: BOS -->
  <rect x="464" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="480" y="882" class="headline" font-size="16" fill="#5B3FD6">3. BOS</text>
  <path d="M 484 900 L 512 920 L 540 905 L 568 935 L 596 970" fill="none" stroke="#C0392B" stroke-width="3"/>
  <text x="480" y="1000" class="body" font-size="13" fill="#333">Break of Structure</text>
  <text x="480" y="1018" class="body" font-size="13" fill="#333">confirms sellers are</text>
  <text x="480" y="1036" class="body" font-size="13" fill="#333">now in control.</text>

  <!-- Panel 4: Order Block -->
  <rect x="676" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="692" y="882" class="headline" font-size="16" fill="#5B3FD6">4. ORDER BLOCK</text>
  <rect x="696" y="905" width="164" height="45" fill="#DDD" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="692" y="1000" class="body" font-size="13" fill="#333">The last bullish candle</text>
  <text x="692" y="1018" class="body" font-size="13" fill="#333">before the strong drop —</text>
  <text x="692" y="1036" class="body" font-size="13" fill="#333">a bearish order block.</text>

  <!-- Panel 5: Entry Setup -->
  <rect x="888" y="850" width="152" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="900" y="882" class="headline" font-size="15" fill="#C0392B">5. ENTRY SETUP</text>
  <path d="M 900 950 L 920 930 L 940 940 L 960 910" fill="none" stroke="#C0392B" stroke-width="3"/>
  <circle cx="940" cy="940" r="8" fill="none" stroke="#1E1B2E" stroke-width="1.5"/>
  <text x="900" y="1000" class="body" font-size="12" fill="#333">Price returns to the OB</text>
  <text x="900" y="1016" class="body" font-size="12" fill="#333">and gets rejected. Enter</text>
  <text x="900" y="1032" class="body" font-size="12" fill="#333">sell on confirmation.</text>

  <!-- THREE-BOX INFO ROW -->
  <rect x="40" y="1090" width="330" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="60" y="1124" class="headline" font-size="19" fill="#2E9E6B">CONFIRMATION FACTORS</text>
  <text x="60" y="1156" class="body" font-size="14" fill="#333">✓ Bearish candlestick rejection</text>
  <text x="60" y="1180" class="body" font-size="14" fill="#333">✓ Lower highs on the retracement</text>
  <text x="60" y="1204" class="body" font-size="14" fill="#333">✓ Strong bearish momentum</text>
  <text x="60" y="1228" class="body" font-size="14" fill="#333">✓ Confluence with higher TF</text>
  <text x="60" y="1252" class="body" font-size="14" fill="#333">✓ Order Block is fresh and valid</text>

  <rect x="385" y="1090" width="300" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="405" y="1124" class="headline" font-size="19" fill="#5B3FD6">BEST TIMEFRAMES</text>
  <text x="405" y="1160" class="body" font-size="14" fill="#333">This setup works best on:</text>
  <text x="415" y="1186" class="body" font-size="14" fill="#333">•  15m</text>
  <text x="415" y="1210" class="body" font-size="14" fill="#333">•  1H</text>
  <text x="415" y="1234" class="body" font-size="14" fill="#333">•  4H</text>
  <text x="415" y="1258" class="body" font-size="14" fill="#333">•  Daily</text>

  <rect x="700" y="1090" width="340" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="720" y="1124" class="headline" font-size="19" fill="#E67E22">PRO TIPS</text>
  <text x="720" y="1156" class="body" font-size="14" fill="#333">✓ Trade in the direction of the</text>
  <text x="732" y="1174" class="body" font-size="14" fill="#333">market structure.</text>
  <text x="720" y="1200" class="body" font-size="14" fill="#333">✓ Patience is key. Wait for the</text>
  <text x="732" y="1218" class="body" font-size="14" fill="#333">perfect retest.</text>
  <text x="720" y="1244" class="body" font-size="14" fill="#333">✓ Risk management is your edge.</text>
  <text x="732" y="1262" class="body" font-size="14" fill="#333">Protect your capital.</text>

  <!-- FOOTER -->
  <rect x="0" y="1340" width="1080" height="80" fill="#1E1B2E"/>
  <text x="540" y="1382" class="headline" font-size="23" fill="#FFFFFF" text-anchor="middle">
    <tspan fill="#2E9E6B">PLAN</tspan> YOUR TRADE. <tspan fill="#5B3FD6">EXECUTE</tspan> WITH DISCIPLINE.
  </text>
  <text x="540" y="1445" class="body" font-size="20" fill="#1E1B2E" text-anchor="middle">Telegram Channel: t.me/CerberusFXTrading</text>

</svg>
