  </defs>

  <rect x="0" y="0" width="1080" height="1620" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" class="title1">CANDLESTICK</text>
  <text x="60" y="167" class="title2">CHEAT SHEET</text>
  <text x="60" y="203" class="subtitle">10 Formationen, die du sofort erkennen solltest</text>

  <!-- Cerberus 3-bar mark -->
  <rect x="900" y="55" width="18" height="40" y2="95" fill="#5B3FD6" transform="translate(0,0)"/>
  <rect x="900" y="75" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Cards grid: 2 cols x 5 rows -->
  <!-- Card template function via manual repeats -->

  <!-- ROW 1 -->
  <g>
