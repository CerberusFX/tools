    <rect x="547" y="1270" width="478" height="228" rx="18" fill="#25213A"/>
    <line x1="586" y1="1348" x2="586" y2="1418" stroke="#E05B5B" stroke-width="4"/>
    <rect x="578" y="1353" width="16" height="50" fill="#E05B5B"/>
