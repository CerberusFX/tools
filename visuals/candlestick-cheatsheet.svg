    <text x="180" y="368" class="desc">Reversal (bullish)</text>
    <text x="180" y="394" class="desc">langer unterer Docht,</text>
    <text x="180" y="420" class="desc">kleiner Body oben</text>
  </g>
  <g>
    <rect x="547" y="270" width="478" height="228" rx="18" fill="#25213A"/>
    <line x1="612" y1="330" x2="612" y2="420" stroke="#E05B5B" stroke-width="4"/>
