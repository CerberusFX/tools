<svg viewBox="0 0 1080 1620" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <style>
      .title1 { font-size:58px; font-weight:bold; fill:#F5F2FC; }
      .title2 { font-size:58px; font-weight:bold; fill:#C9C2E8; }
      .subtitle { font-size:24px; fill:#C9C2E8; }
      .name { font-size:24px; font-weight:bold; fill:#F5F2FC; }
      .desc { font-size:16px; fill:#C9C2E8; }
      .footer { font-size:28px; font-weight:bold; fill:#F5F2FC; }
