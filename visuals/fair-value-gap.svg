<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1500" viewBox="0 0 1080 1500">
  <defs>
    <style>
      .headline { font-family: 'DejaVu Sans', sans-serif; font-weight: bold; }
      .body { font-family: 'DejaVu Sans', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="1500" fill="#FFFFFF"/>

  <!-- HEADER -->
  <text x="40" y="70" class="headline" font-size="42" fill="#1E1B2E">SMART MONEY CONCEPTS:</text>
  <text x="40" y="126" class="headline" font-size="50">
    <tspan fill="#5B3FD6">FAIR VALUE GAP</tspan>
    <tspan fill="#1E1B2E"> (FVG)</tspan>
  </text>
  <rect x="40" y="150" width="660" height="42" rx="4" fill="#1E1B2E"/>
  <text x="60" y="178" class="headline" font-size="19" fill="#FFFFFF">PRICE OFTEN RETURNS TO FILL THE IMBALANCE.</text>

  <!-- MAIN VISUAL AREA -->
  <rect x="40" y="210" width="1000" height="620" fill="#FDFDFD" stroke="#E5E0F0" stroke-width="2"/>

  <!-- 3-candle FVG sequence: candle1, big impulse candle2, candle3 leaving a gap -->
  <!-- candle 1 -->
  <line x1="150" y1="380" x2="150" y2="480" stroke="#1E1B2E" stroke-width="2"/>
  <rect x="130" y="400" width="40" height="55" fill="#2E9E6B"/>

  <!-- candle 2 (impulse) -->
  <line x1="230" y1="280" x2="230" y2="460" stroke="#1E1B2E" stroke-width="2"/>
  <rect x="210" y="300" width="40" height="140" fill="#2E9E6B"/>

  <!-- candle 3 -->
  <line x1="310" y1="260" x2="310" y2="360" stroke="#1E1B2E" stroke-width="2"/>
  <rect x="290" y="280" width="40" height="50" fill="#2E9E6B"/>

  <!-- the gap zone between candle1 high and candle3 low -->
  <rect x="130" y="330" width="220" height="70" fill="#C9C2E8" opacity="0.5"/>
  <text x="360" y="355" class="body" font-size="15" fill="#5B3FD6" font-weight="bold">FAIR VALUE GAP</text>
  <text x="360" y="373" class="body" font-size="12" fill="#333">Imbalance between candle 1 high</text>
  <text x="360" y="389" class="body" font-size="12" fill="#333">and candle 3 low</text>

  <!-- continued rally -->
  <path d="M 330 300 L 380 260 L 430 230 L 480 210"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>

  <!-- pullback into FVG -->
  <path d="M 480 210 L 520 280 L 560 350 L 600 390"
        fill="none" stroke="#C0392B" stroke-width="4"/>
  <circle cx="580" cy="365" r="18" fill="none" stroke="#1E1B2E" stroke-width="2"/>
  <text x="620" y="360" class="body" font-size="14" fill="#2E9E6B" font-weight="bold">FVG FILL &amp; ENTRY</text>
  <text x="620" y="378" class="body" font-size="12" fill="#333">Price returns into the gap</text>

  <!-- bounce continuation -->
  <path d="M 600 390 L 640 340 L 680 290 L 720 250 L 760 220"
        fill="none" stroke="#2E9E6B" stroke-width="4"/>

  <!-- stop loss -->
  <rect x="530" y="395" width="150" height="45" fill="#F2C6C1" opacity="0.7"/>
  <text x="545" y="418" class="body" font-size="14" fill="#C0392B" font-weight="bold">STOP LOSS</text>
  <text x="545" y="435" class="body" font-size="12" fill="#333">Below the FVG / candle 1 low</text>

  <!-- take profit -->
  <line x1="760" y1="220" x2="760" y2="700" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="620" y="690" class="body" font-size="14" fill="#5B3FD6" font-weight="bold">TAKE PROFIT</text>
  <text x="620" y="708" class="body" font-size="12" fill="#333">Next liquidity level or swing high</text>

  <!-- Key Rules sidebar -->
  <rect x="770" y="230" width="250" height="530" fill="#1E1B2E" rx="6"/>
  <text x="800" y="266" class="headline" font-size="22" fill="#FFFFFF">KEY RULES</text>

  <circle cx="800" cy="298" r="12" fill="#2E9E6B"/>
  <text x="800" y="303" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="822" y="292" class="body" font-size="14" fill="#F5F2FC">Spot a 3-candle impulse</text>
  <text x="822" y="308" class="body" font-size="14" fill="#F5F2FC">leaving a price gap.</text>

  <circle cx="800" cy="336" r="12" fill="#2E9E6B"/>
  <text x="800" y="341" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="822" y="330" class="body" font-size="14" fill="#F5F2FC">Mark the gap between</text>
  <text x="822" y="346" class="body" font-size="14" fill="#F5F2FC">candle 1 and candle 3.</text>

  <circle cx="800" cy="374" r="12" fill="#2E9E6B"/>
  <text x="800" y="379" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="822" y="368" class="body" font-size="14" fill="#F5F2FC">Wait for price to return</text>
  <text x="822" y="384" class="body" font-size="14" fill="#F5F2FC">and tap into the gap.</text>

  <circle cx="800" cy="412" r="12" fill="#2E9E6B"/>
  <text x="800" y="417" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="822" y="406" class="body" font-size="14" fill="#F5F2FC">Confirm rejection at</text>
  <text x="822" y="422" class="body" font-size="14" fill="#F5F2FC">the gap's midpoint/edge.</text>

  <circle cx="800" cy="450" r="12" fill="#2E9E6B"/>
  <text x="800" y="455" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="822" y="444" class="body" font-size="14" fill="#F5F2FC">Enter in the direction</text>
  <text x="822" y="460" class="body" font-size="14" fill="#F5F2FC">of the original impulse.</text>

  <circle cx="800" cy="488" r="12" fill="#2E9E6B"/>
  <text x="800" y="493" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="822" y="482" class="body" font-size="14" fill="#F5F2FC">Place Stop Loss beyond</text>
  <text x="822" y="498" class="body" font-size="14" fill="#F5F2FC">the far side of the gap.</text>

  <circle cx="800" cy="526" r="12" fill="#2E9E6B"/>
  <text x="800" y="531" class="headline" font-size="13" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="822" y="520" class="body" font-size="14" fill="#F5F2FC">Target the next liquidity</text>
  <text x="822" y="536" class="body" font-size="14" fill="#F5F2FC">level or swing point.</text>

  <!-- FIVE-STEP PANEL ROW -->
  <rect x="40" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="56" y="882" class="headline" font-size="16" fill="#5B3FD6">1. THE IMPULSE</text>
  <rect x="60" y="920" width="18" height="40" fill="#2E9E6B"/>
  <rect x="90" y="900" width="18" height="70" fill="#2E9E6B"/>
  <rect x="120" y="915" width="18" height="35" fill="#2E9E6B"/>
  <text x="56" y="1000" class="body" font-size="13" fill="#333">A strong 3-candle move</text>
  <text x="56" y="1018" class="body" font-size="13" fill="#333">creates an imbalance</text>
  <text x="56" y="1036" class="body" font-size="13" fill="#333">between price levels.</text>

  <rect x="252" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="268" y="882" class="headline" font-size="16" fill="#5B3FD6">2. THE GAP</text>
  <rect x="272" y="915" width="164" height="30" fill="#C9C2E8" opacity="0.7"/>
  <text x="268" y="1000" class="body" font-size="13" fill="#333">The unfilled zone between</text>
  <text x="268" y="1018" class="body" font-size="13" fill="#333">candle 1's wick and</text>
  <text x="268" y="1036" class="body" font-size="13" fill="#333">candle 3's wick.</text>

  <rect x="464" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="480" y="882" class="headline" font-size="16" fill="#5B3FD6">3. THE RETURN</text>
  <path d="M 484 900 L 512 930 L 540 950 L 568 935" fill="none" stroke="#C0392B" stroke-width="3"/>
  <text x="480" y="1000" class="body" font-size="13" fill="#333">Price often retraces back</text>
  <text x="480" y="1018" class="body" font-size="13" fill="#333">to rebalance the gap</text>
  <text x="480" y="1036" class="body" font-size="13" fill="#333">before continuing.</text>

  <rect x="676" y="850" width="204" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="692" y="882" class="headline" font-size="16" fill="#5B3FD6">4. THE REJECTION</text>
  <circle cx="770" cy="935" r="16" fill="none" stroke="#1E1B2E" stroke-width="2"/>
  <text x="692" y="1000" class="body" font-size="13" fill="#333">Watch for a rejection</text>
  <text x="692" y="1018" class="body" font-size="13" fill="#333">candle at the gap's edge</text>
  <text x="692" y="1036" class="body" font-size="13" fill="#333">or 50% midpoint.</text>

  <rect x="888" y="850" width="152" height="220" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="900" y="882" class="headline" font-size="15" fill="#2E9E6B">5. CONTINUATION</text>
  <path d="M 900 950 L 920 920 L 940 930 L 960 890" fill="none" stroke="#2E9E6B" stroke-width="3"/>
  <text x="900" y="1000" class="body" font-size="12" fill="#333">Price resumes in the</text>
  <text x="900" y="1016" class="body" font-size="12" fill="#333">direction of the original</text>
  <text x="900" y="1032" class="body" font-size="12" fill="#333">impulse move.</text>

  <!-- THREE-BOX INFO ROW -->
  <rect x="40" y="1090" width="330" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="60" y="1124" class="headline" font-size="19" fill="#2E9E6B">CONFIRMATION FACTORS</text>
  <text x="60" y="1156" class="body" font-size="14" fill="#333">✓ Gap formed by a strong impulse</text>
  <text x="60" y="1180" class="body" font-size="14" fill="#333">✓ Rejection wick at the gap edge</text>
  <text x="60" y="1204" class="body" font-size="14" fill="#333">✓ Confluence with Order Block</text>
  <text x="60" y="1228" class="body" font-size="14" fill="#333">✓ Aligned with higher TF trend</text>
  <text x="60" y="1252" class="body" font-size="14" fill="#333">✓ Gap not yet fully filled before</text>

  <rect x="385" y="1090" width="300" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="405" y="1124" class="headline" font-size="19" fill="#5B3FD6">BEST TIMEFRAMES</text>
  <text x="405" y="1160" class="body" font-size="14" fill="#333">This setup works best on:</text>
  <text x="415" y="1186" class="body" font-size="14" fill="#333">•  15m</text>
  <text x="415" y="1210" class="body" font-size="14" fill="#333">•  1H</text>
  <text x="415" y="1234" class="body" font-size="14" fill="#333">•  4H</text>
  <text x="415" y="1258" class="body" font-size="14" fill="#333">•  Daily</text>

  <rect x="700" y="1090" width="340" height="230" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
  <text x="720" y="1124" class="headline" font-size="19" fill="#E67E22">PRO TIPS</text>
  <text x="720" y="1156" class="body" font-size="14" fill="#333">✓ Not every gap gets filled —</text>
  <text x="732" y="1174" class="body" font-size="14" fill="#333">strong trends can skip it.</text>
  <text x="720" y="1200" class="body" font-size="14" fill="#333">✓ Combine with Order Blocks for</text>
  <text x="732" y="1218" class="body" font-size="14" fill="#333">higher-probability entries.</text>
  <text x="720" y="1244" class="body" font-size="14" fill="#333">✓ Smaller gaps = weaker</text>
  <text x="732" y="1262" class="body" font-size="14" fill="#333">imbalance, less reliable.</text>

  <!-- FOOTER -->
  <rect x="0" y="1340" width="1080" height="80" fill="#1E1B2E"/>
  <text x="540" y="1382" class="headline" font-size="23" fill="#FFFFFF" text-anchor="middle">
    <tspan fill="#2E9E6B">PLAN</tspan> YOUR TRADE. <tspan fill="#5B3FD6">EXECUTE</tspan> WITH DISCIPLINE.
  </text>
  <text x="540" y="1445" class="body" font-size="20" fill="#1E1B2E" text-anchor="middle">Telegram Channel: t.me/CerberusFXTrading</text>

</svg>
