<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="58" font-weight="bold" fill="#F5F2FC">HEAD &amp; SHOULDERS</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">CHEAT SHEET</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">The classic reversal pattern, explained</text>

  <!-- Cerberus mark -->
  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Chart card -->
  <rect x="55" y="250" width="970" height="440" rx="18" fill="#25213A"/>

  <!-- Neckline -->
  <line x1="110" y1="560" x2="970" y2="590" stroke="#C9C2E8" stroke-width="3" stroke-dasharray="10,8"/>
  <text x="780" y="545" font-size="18" fill="#C9C2E8">Neckline</text>

  <!-- Price path: left shoulder, head, right shoulder, breakdown -->
  <path d="M 110 520
           L 220 380
           L 300 470
           L 430 300
           L 560 480
           L 680 400
           L 800 560
           L 920 680"
        fill="none" stroke="#5B3FD6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Peak markers -->
  <circle cx="220" cy="380" r="7" fill="#2E9E6B"/>
  <circle cx="430" cy="300" r="7" fill="#E05B5B"/>
  <circle cx="680" cy="400" r="7" fill="#2E9E6B"/>

  <text x="150" y="350" font-size="18" font-weight="bold" fill="#F5F2FC">Left Shoulder</text>
  <text x="370" y="270" font-size="18" font-weight="bold" fill="#F5F2FC">Head</text>
  <text x="600" y="370" font-size="18" font-weight="bold" fill="#F5F2FC">Right Shoulder</text>

  <!-- Breakdown arrow -->
  <line x1="800" y1="560" x2="920" y2="680" stroke="#E05B5B" stroke-width="6" stroke-linecap="round"/>
  <text x="800" y="640" font-size="18" font-weight="bold" fill="#E05B5B">Breakdown</text>

  <!-- Info cards below chart -->
  <g>
    <rect x="55" y="730" width="308" height="230" rx="16" fill="#25213A"/>
    <text x="80" y="775" font-size="22" font-weight="bold" fill="#F5F2FC">Structure</text>
    <text x="80" y="812" font-size="16" fill="#C9C2E8">Three peaks: a high,</text>
    <text x="80" y="838" font-size="16" fill="#C9C2E8">a higher high (the head),</text>
    <text x="80" y="864" font-size="16" fill="#C9C2E8">then a lower high again.</text>
    <text x="80" y="900" font-size="16" fill="#C9C2E8">Appears after an uptrend.</text>
  </g>
  <g>
    <rect x="386" y="730" width="308" height="230" rx="16" fill="#25213A"/>
    <text x="411" y="775" font-size="22" font-weight="bold" fill="#F5F2FC">Entry</text>
    <text x="411" y="812" font-size="16" fill="#C9C2E8">Confirmed once price</text>
    <text x="411" y="838" font-size="16" fill="#C9C2E8">closes below the</text>
    <text x="411" y="864" font-size="16" fill="#C9C2E8">neckline with</text>
    <text x="411" y="900" font-size="16" fill="#C9C2E8">follow-through volume.</text>
  </g>
  <g>
    <rect x="717" y="730" width="308" height="230" rx="16" fill="#25213A"/>
    <text x="742" y="775" font-size="22" font-weight="bold" fill="#F5F2FC">Target</text>
    <text x="742" y="812" font-size="16" fill="#C9C2E8">Measure head-to-neckline</text>
    <text x="742" y="838" font-size="16" fill="#C9C2E8">distance, project the</text>
    <text x="742" y="864" font-size="16" fill="#C9C2E8">same distance down</text>
    <text x="742" y="900" font-size="16" fill="#C9C2E8">from the breakdown point.</text>
  </g>

  <text x="60" y="1020" font-size="18" fill="#C9C2E8">Stop-loss typically sits just above the right shoulder.</text>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
