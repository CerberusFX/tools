<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="52" font-weight="bold" fill="#F5F2FC">SUPPORT &amp; RESISTANCE</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">ROLE REVERSAL</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">Why old resistance becomes new support (and vice versa)</text>

  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Chart card -->
  <rect x="55" y="250" width="970" height="480" rx="18" fill="#25213A"/>

  <!-- Level line -->
  <line x1="100" y1="480" x2="960" y2="480" stroke="#C9C2E8" stroke-width="3" stroke-dasharray="10,8"/>

  <!-- Price path: approaches resistance, rejects twice, breaks through, retests as support, continues up -->
  <path d="M 110 620
           L 230 500
           L 300 560
           L 400 490
           L 470 560
           L 560 480
           L 650 380
           L 720 470
           L 800 350
           L 900 300"
        fill="none" stroke="#5B3FD6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rejection points -->
  <circle cx="230" cy="500" r="7" fill="#E05B5B"/>
  <circle cx="400" cy="490" r="7" fill="#E05B5B"/>
  <!-- Breakout point -->
  <circle cx="560" cy="480" r="8" fill="#F5F2FC"/>
  <!-- Retest as support -->
  <circle cx="720" cy="470" r="8" fill="#2E9E6B"/>

  <text x="150" y="430" font-size="16" fill="#E05B5B">Rejected twice</text>
  <text x="150" y="450" font-size="16" fill="#E05B5B">(resistance holds)</text>

  <text x="540" y="440" font-size="16" font-weight="bold" fill="#F5F2FC">Breakout</text>
  <text x="660" y="430" font-size="16" font-weight="bold" fill="#2E9E6B">Retest = new support</text>

  <text x="800" y="620" font-size="16" fill="#C9C2E8">Uptrend continues</text>

  <!-- Info cards -->
  <g>
    <rect x="55" y="770" width="308" height="300" rx="16" fill="#25213A"/>
    <text x="80" y="815" font-size="22" font-weight="bold" fill="#F5F2FC">Why it happens</text>
    <text x="80" y="852" font-size="16" fill="#C9C2E8">Traders who missed</text>
    <text x="80" y="878" font-size="16" fill="#C9C2E8">buying below resistance</text>
    <text x="80" y="904" font-size="16" fill="#C9C2E8">now see the breakout</text>
    <text x="80" y="930" font-size="16" fill="#C9C2E8">level as a safe re-entry</text>
    <text x="80" y="956" font-size="16" fill="#C9C2E8">on the retest.</text>
  </g>
  <g>
    <rect x="386" y="770" width="308" height="300" rx="16" fill="#25213A"/>
    <text x="411" y="815" font-size="22" font-weight="bold" fill="#F5F2FC">How to trade it</text>
    <text x="411" y="852" font-size="16" fill="#C9C2E8">Wait for the breakout,</text>
    <text x="411" y="878" font-size="16" fill="#C9C2E8">then wait again for</text>
    <text x="411" y="904" font-size="16" fill="#C9C2E8">price to come back</text>
    <text x="411" y="930" font-size="16" fill="#C9C2E8">and hold the level</text>
    <text x="411" y="956" font-size="16" fill="#C9C2E8">before entering.</text>
  </g>
  <g>
    <rect x="717" y="770" width="308" height="300" rx="16" fill="#25213A"/>
    <text x="742" y="815" font-size="22" font-weight="bold" fill="#F5F2FC">Invalidation</text>
    <text x="742" y="852" font-size="16" fill="#C9C2E8">If price closes back</text>
    <text x="742" y="878" font-size="16" fill="#C9C2E8">below the old resistance</text>
    <text x="742" y="904" font-size="16" fill="#C9C2E8">level, the role reversal</text>
    <text x="742" y="930" font-size="16" fill="#C9C2E8">has failed — treat it</text>
    <text x="742" y="956" font-size="16" fill="#C9C2E8">as a false breakout.</text>
  </g>

  <text x="60" y="1120" font-size="18" fill="#C9C2E8">Works the same in reverse: broken support often becomes resistance on the way back down.</text>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
