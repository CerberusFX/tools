<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="1350" fill="#1E1B2E"/>
  <rect x="0" y="0" width="1080" height="12" fill="#5B3FD6"/>

  <text x="60" y="105" font-size="58" font-weight="bold" fill="#F5F2FC">FIBONACCI</text>
  <text x="60" y="167" font-size="42" font-weight="bold" fill="#C9C2E8">RETRACEMENT CHEAT SHEET</text>
  <text x="60" y="203" font-size="24" fill="#C9C2E8">Key levels and how price tends to react</text>

  <rect x="900" y="55" width="18" height="40" fill="#5B3FD6"/>
  <rect x="926" y="55" width="18" height="60" fill="#C9C2E8"/>
  <rect x="952" y="70" width="18" height="45" fill="#5B3FD6"/>

  <!-- Chart card with fib levels -->
  <rect x="55" y="250" width="970" height="560" rx="18" fill="#25213A"/>

  <!-- Levels as horizontal dashed lines -->
  <line x1="100" y1="300" x2="960" y2="300" stroke="#C9C2E8" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="920" y="292" font-size="16" fill="#C9C2E8">0%</text>

  <line x1="100" y1="380" x2="960" y2="380" stroke="#2E9E6B" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="900" y="372" font-size="16" fill="#2E9E6B">23.6%</text>

  <line x1="100" y1="440" x2="960" y2="440" stroke="#2E9E6B" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="900" y="432" font-size="16" fill="#2E9E6B">38.2%</text>

  <line x1="100" y1="500" x2="960" y2="500" stroke="#F5F2FC" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="900" y="492" font-size="16" fill="#F5F2FC">50%</text>

  <line x1="100" y1="560" x2="960" y2="560" stroke="#5B3FD6" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="900" y="552" font-size="16" fill="#C9C2E8">61.8%</text>

  <line x1="100" y1="650" x2="960" y2="650" stroke="#C9C2E8" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="920" y="642" font-size="16" fill="#C9C2E8">100%</text>

  <!-- Price path: rally then pullback to 61.8 -->
  <path d="M 130 650 L 300 300 L 500 560"
        fill="none" stroke="#5B3FD6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="500" cy="560" r="8" fill="#2E9E6B"/>
  <text x="520" y="555" font-size="16" font-weight="bold" fill="#2E9E6B">Common bounce zone</text>

  <text x="130" y="680" font-size="15" fill="#C9C2E8">Swing Low</text>
  <text x="270" y="290" font-size="15" fill="#C9C2E8">Swing High</text>

  <!-- Info cards -->
  <g>
    <rect x="55" y="850" width="308" height="220" rx="16" fill="#25213A"/>
    <text x="80" y="895" font-size="22" font-weight="bold" fill="#F5F2FC">38.2% &amp; 23.6%</text>
    <text x="80" y="932" font-size="16" fill="#C9C2E8">Shallow pullbacks.</text>
    <text x="80" y="958" font-size="16" fill="#C9C2E8">Common in strong,</text>
    <text x="80" y="984" font-size="16" fill="#C9C2E8">fast-moving trends.</text>
  </g>
  <g>
    <rect x="386" y="850" width="308" height="220" rx="16" fill="#25213A"/>
    <text x="411" y="895" font-size="22" font-weight="bold" fill="#F5F2FC">50% &amp; 61.8%</text>
    <text x="411" y="932" font-size="16" fill="#C9C2E8">The "golden zone" —</text>
    <text x="411" y="958" font-size="16" fill="#C9C2E8">watched most closely</text>
    <text x="411" y="984" font-size="16" fill="#C9C2E8">for reaction/reversal.</text>
  </g>
  <g>
    <rect x="717" y="850" width="308" height="220" rx="16" fill="#25213A"/>
    <text x="742" y="895" font-size="22" font-weight="bold" fill="#F5F2FC">Beyond 78.6%</text>
    <text x="742" y="932" font-size="16" fill="#C9C2E8">Deep retracement —</text>
    <text x="742" y="958" font-size="16" fill="#C9C2E8">original trend may</text>
    <text x="742" y="984" font-size="16" fill="#C9C2E8">be losing strength.</text>
  </g>

  <text x="60" y="1130" font-size="18" fill="#C9C2E8">Fib levels work best combined with support/resistance or trend confirmation —</text>
  <text x="60" y="1160" font-size="18" fill="#C9C2E8">never use them in isolation.</text>

  <rect x="0" y="1274" width="1080" height="4" fill="#3A2599"/>
  <text x="60" y="1320" font-size="28" font-weight="bold" fill="#F5F2FC">t.me/CerberusFXTrading</text>
  <text x="820" y="1316" font-size="20" fill="#C9C2E8">Free tools · daily</text>
</svg>
